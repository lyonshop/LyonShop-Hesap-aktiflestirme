
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Hesap Sistemi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e7f3e7;
            border-radius: 4px;
            border: 1px solid #d4f4d4;
            display: none;
        }
        .error {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8d7da;
            border-radius: 4px;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: none;
        }
    </style>
</head>
<body>

        const usedCodes = new Set();  // Kullanılmış kodları saklamak için

        function checkCode() {
            const code = document.getElementById("gameCode").value.toUpperCase();
            const resultDiv = document.getElementById("result");
            const errorDiv = document.getElementById("error");

            // Eğer kod daha önce kullanılmışsa
            if (usedCodes.has(code)) {
                errorDiv.style.display = "block";
                resultDiv.style.display = "none";
                return;
            }

            // Geçerli kodsa
            if(gameData[code]) {
                usedCodes.add(code);  // Kodu "kullanılmış" olarak işaretle
                resultDiv.style.display = "block";
                resultDiv.innerHTML = gameData[code];
                errorDiv.style.display = "none";
            } else {
                errorDiv.style.display = "none";
                alert("Geçersiz kod!");
            }
        }
    </script>
